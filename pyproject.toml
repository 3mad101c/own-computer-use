[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "own-computer-use-mcp"
version = "1.1.0"
description = "Self-hosted Computer Use MCP server for Windows: 21 tools, Arabic+English OCR, hard consent gate on every mutating action."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "3mad101c", email = "3mad101c@users.noreply.github.com" }]
keywords = ["mcp", "computer-use", "windows", "automation", "ocr", "claude", "gui-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastmcp",
  "mss",
  "pillow",
  "pyautogui",
  "pyperclip",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime"]
agent = ["anthropic"]

[project.urls]
Homepage = "https://github.com/3mad101c/own-computer-use"
Repository = "https://github.com/3mad101c/own-computer-use"
Issues = "https://github.com/3mad101c/own-computer-use/issues"
Security = "https://github.com/3mad101c/own-computer-use/blob/main/SECURITY.md"

[project.scripts]
own-computer-use = "mcp_server:main"

[tool.hatch.build.targets.wheel]
only-include = ["mcp_server.py", "screen.py", "agent.py"]
sources = ["."]
