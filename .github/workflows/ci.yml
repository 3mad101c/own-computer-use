name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax and security self-audit
        run: |
          python -m py_compile mcp_server.py screen.py agent.py
          python -c "import ast; [ast.parse(open(f, encoding='utf-8').read()) for f in ('mcp_server.py', 'screen.py', 'agent.py')]; print('AST OK')"

      - name: MCP registration test
        run: python test_registration.py
